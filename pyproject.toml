[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-to-pdf"
version = "1.0.0"
description = "Convierte archivos Markdown a PDF y Word (.docx) con estilo corporativo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=4.0.0",
    "mdit-py-plugins>=0.5.0",
    "beautifulsoup4>=4.14.0",
    "lxml>=6.0.0",
    "playwright>=1.50.0",
    "PyMuPDF>=1.27.0",
    "python-docx>=1.2.0",
    "latex2mathml>=3.79.0",
    "requests>=2.31.0",
    "Pygments>=2.18.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
markdown-to-pdf = "markdown_to_pdf.cli:main"
markdown-to-pdf-setup = "scripts.setup_env:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
